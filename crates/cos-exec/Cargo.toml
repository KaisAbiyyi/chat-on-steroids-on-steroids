[package]
name = "cos-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cos-core = { path = "../cos-core" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
uuid.workspace = true
portable-pty = "0.9.0"
anyhow = "1.0.100"
base64 = "0.22.1"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true
