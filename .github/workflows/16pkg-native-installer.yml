# CoSoS 16PKG native cloud workflow
name: 16PKG Windows package candidate
on:
  pull_request:
    paths:
      - 'tools/release_16pkg.py'
      - 'tools/test_release_16pkg.py'
      - 'apps/windows-installer/**'
      - '.github/workflows/16pkg-native-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Run package negative tests
        run: python -m unittest -v tools.test_release_16pkg
      - name: Build production Rust CLI
        run: cargo build --release --locked -p cos-app
      - name: Publish real Windows renderer
        run: dotnet publish apps/windows-renderer/WindowsRenderer.csproj -c Release -o renderer-package
      - name: Build source-pinned candidate ZIP
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Unpinned source' }
          python tools/release_16pkg.py build --binary target/release/cos-rust.exe --renderer-dir renderer-package --license LICENSE --out candidate.zip --source-sha $sha --version 0.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Bundle build failed' }
          $sha | Out-File -FilePath source-sha.txt -NoNewline -Encoding ascii
      - name: Compile actual Windows setup
        shell: pwsh
        run: |
          dotnet publish apps/windows-installer/CoSoSInstaller.csproj -c Release -r win-x64 -p:BundlePath="$((Resolve-Path candidate.zip).Path)" -p:SourceShaPath="$((Resolve-Path source-sha.txt).Path)" -o installer-package
          if ($LASTEXITCODE -ne 0) { throw 'Native setup build failed' }
          & installer-package/CoSoSInstaller.exe --verify
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload digest invalid' }
          & installer-package/CoSoSInstaller.exe --install 'D:\\projects\\CoSoS-16PKG-smoke' --publisher ('A' * 40)
          if ($LASTEXITCODE -eq 0) { throw 'Unsigned candidate installed unexpectedly' }
          $global:LASTEXITCODE = 0
      - name: Record artifact digests
        shell: pwsh
        run: |
          @{ sourceSha=(git rev-parse HEAD).Trim(); signed=$false; native16L1Accepted=$false; zipSha256=(Get-FileHash candidate.zip -Algorithm SHA256).Hash; setupSha256=(Get-FileHash installer-package/CoSoSInstaller.exe -Algorithm SHA256).Hash } | ConvertTo-Json | Out-File -Encoding utf8 package-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: cosos-16pkg-unsigned-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            candidate.zip
            installer-package/CoSoSInstaller.exe
            package-receipt.json
          if-no-files-found: error