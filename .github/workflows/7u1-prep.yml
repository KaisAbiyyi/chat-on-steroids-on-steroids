name: 7U1-PREP fail-closed security (not owner acceptance)

on:
  pull_request:
    paths:
      - "probes/7u1/**"
      - ".github/workflows/7u1-prep.yml"
  push:
    branches: ["work/7u1-prep-*"]
    paths:
      - "probes/7u1/**"
      - ".github/workflows/7u1-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-negative-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s probes/7u1/tests -p 'test_*.py' -v
      - run: python -m py_compile probes/7u1/preflight.py probes/7u1/package_artifact.py probes/7u1/audit_production_host.py probes/7u1/observe_only_contract.py

  windows-negative-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s probes/7u1/tests -p "test_*.py" -v
      - run: python -m py_compile probes/7u1/preflight.py probes/7u1/package_artifact.py probes/7u1/audit_production_host.py probes/7u1/observe_only_contract.py

  windows-powershell-runner-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Parse owner preflight without executing local actions
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'probes/7u1/run-preflight.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

  windows-source-build-not-owner-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.91.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build existing synthetic Rust bridge
        run: cargo build --locked -p cos-core --example 7l2_bridge --release
      - name: Publish existing synthetic WebView2 host
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP '7u1-synthetic-artifact'
          $hostDir = Join-Path $stage 'host'
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          dotnet publish probes/7l1/WindowsHost/WindowsHost.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false -warnaserror -o $hostDir
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic host publish failed' }
          Copy-Item -LiteralPath target/release/examples/7l2_bridge.exe -Destination (Join-Path $stage '7l2_bridge.exe')
          python probes/7u1/package_artifact.py --repo . --artifact $stage
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic SHA256 artifact packaging failed' }
          $sha = (git rev-parse HEAD).Trim()
          if ((Get-Content (Join-Path $stage 'source.sha') -Raw).Trim() -ne $sha) { throw 'Package SHA differs from checkout' }
          Write-Host "SYNTHETIC-only source-attested artifact at $sha; never 7U1 signed-in acceptance"
      - name: Prove synthetic artifact remains BLOCKED for production 7U1
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP '7u1-synthetic-artifact'
          $receipt = Join-Path $env:RUNNER_TEMP '7u1-synthetic-preflight.json'
          $sha = (git rev-parse HEAD).Trim()
          python probes/7u1/preflight.py --repo . --artifact $stage --expected-sha $sha --provider chatgpt --profile 7u1-cloud-fixture001 --receipt $receipt
          $status = $LASTEXITCODE
          if ($status -ne 2) { throw "Expected fail-closed exit 2; got $status" }
          $result = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($result.preflightStatus -ne 'BLOCKED' -or $result.owner7U1Status -ne 'NOT_RUN' -or
              $result.owner7U1Accepted -or $null -ne $result.outgoingSendCount -or
              $result.checks.artifact_manifest.status -ne 'PASS' -or
              $result.checks.product_native_adapter.status -ne 'BLOCKED' -or
              $result.checks.explicit_owner_opt_in.status -ne 'BLOCKED') {
            throw 'Synthetic binaries must not receive product/owner acceptance'
          }
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 7u1-prep-synthetic-native-only
          path: ${{ runner.temp }}/7u1-synthetic-artifact/
          if-no-files-found: error
          retention-days: 7

  windows-production-host-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.91.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build actual production 8P Windows host and Rust bridge
        shell: pwsh
        run: |
          cargo build --locked -p cos-core --example 7l2_bridge --release
          if ($LASTEXITCODE -ne 0) { throw 'Production Rust bridge build failed' }
          $stage = Join-Path $env:RUNNER_TEMP '7u1-production-8p-handshake-only'
          $hostDir = Join-Path $stage 'host'
          $sourceDir = Join-Path $stage 'source'
          $extensionDir = Join-Path $sourceDir 'extension'
          New-Item -ItemType Directory -Force -Path $hostDir,$extensionDir | Out-Null
          dotnet publish apps/windows-host/WindowsHost.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false -warnaserror -o $hostDir
          if ($LASTEXITCODE -ne 0) { throw 'Production 8P Windows host publish failed' }
          Copy-Item -LiteralPath target/release/examples/7l2_bridge.exe -Destination (Join-Path $stage '7l2_bridge.exe')
          Copy-Item -LiteralPath apps/windows-host/Native8P.cs -Destination (Join-Path $sourceDir 'Native8P.cs')
          Copy-Item -LiteralPath crates/cos-core/src/native_browser_bridge.rs -Destination (Join-Path $sourceDir 'native_browser_bridge.rs')
          Copy-Item -LiteralPath probes/8p/extension/manifest.json -Destination (Join-Path $extensionDir 'manifest.json')
          Copy-Item -LiteralPath probes/8p/extension/sw.mjs -Destination (Join-Path $extensionDir 'sw.mjs')
          $sha = (git rev-parse HEAD).Trim()
          $audit = Join-Path $stage 'production-host-audit.json'
          python probes/7u1/audit_production_host.py --repo . --expected-sha $sha --out $audit
          if ($LASTEXITCODE -ne 0) { throw 'Production host source audit could not bind to exact HEAD' }
          $auditResult = Get-Content -LiteralPath $audit -Raw | ConvertFrom-Json
          if ($auditResult.productionObservationStatus -ne 'BLOCKED' -or
              $auditResult.sourceSha -ne $sha -or $auditResult.owner7U1Status -ne 'NOT_RUN' -or
              $auditResult.humanConsentSimulated -or $auditResult.providerAccessPerformed -or
              $null -ne $auditResult.outgoingSendCount) {
            throw 'Production 8P must remain explicitly BLOCKED for 7U1 until its read-only API exists'
          }
          python probes/7u1/package_artifact.py --repo . --artifact $stage --kind production-8p-handshake-only-not-7u1
          if ($LASTEXITCODE -ne 0) { throw 'Production handshake-only SHA256 packaging failed' }
          $receipt = Join-Path $env:RUNNER_TEMP '7u1-production-preflight.json'
          python probes/7u1/preflight.py --repo . --artifact $stage --expected-sha $sha --provider chatgpt --profile 7u1-cloud-fixture001 --receipt $receipt
          $status = $LASTEXITCODE
          if ($status -ne 2) { throw "Expected production 7U1 gate BLOCKED (exit 2); got $status" }
          $result = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($result.preflightStatus -ne 'BLOCKED' -or $result.owner7U1Status -ne 'NOT_RUN' -or
              $result.owner7U1Accepted -or $null -ne $result.outgoingSendCount -or
              $result.checks.artifact_manifest.status -ne 'PASS' -or
              $result.checks.product_native_adapter.status -ne 'BLOCKED') {
            throw 'Production handshake-only artifact must never receive 7U1 acceptance'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 7u1-prep-production-8p-handshake-only-not-7u1
          path: ${{ runner.temp }}/7u1-production-8p-handshake-only/
          if-no-files-found: error
          retention-days: 7
