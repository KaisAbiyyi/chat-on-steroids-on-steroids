name: 16L1 targeted post-merge provenance preflight
on:
  pull_request:
    paths:
      - '.github/scripts/16pkg-16l1-guards.ps1'
      - '.github/scripts/16pkg-16l1-local-qualification.ps1'
      - '.github/scripts/16pkg-16l1-artifact-provenance.ps1'
      - '.github/scripts/16pkg-16l1-preflight.tests.ps1'
      - '.github/workflows/16l1-provenance-preflight.yml'
      - 'docs/implementation-summary/2026-10-29-16l1-physical-acl-handoff.md'
      - 'apps/windows-installer/README.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  historical-provenance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only (no native compilation)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Parse changed PowerShell + hosted fail-closed regression tests
        shell: pwsh
        run: |
          foreach ($path in @(
            '.github/scripts/16pkg-16l1-guards.ps1',
            '.github/scripts/16pkg-16l1-local-qualification.ps1',
            '.github/scripts/16pkg-16l1-artifact-provenance.ps1',
            '.github/scripts/16pkg-16l1-preflight.tests.ps1'
          )) {
            $tokens=$null
            $issues=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,[ref]$tokens,[ref]$issues) | Out-Null
            if ($issues.Count -ne 0) { throw "PowerShell syntax rejected: $path - $issues" }
          }
          & .github/scripts/16pkg-16l1-preflight.tests.ps1
          if (!$?) { throw 'Hosted negative security test failed' }
      - name: Download only previously verified historical artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root=Join-Path $env:RUNNER_TEMP '16l1-historical'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          gh run download 40710902296 --repo "$env:GITHUB_REPOSITORY" --name cosos-16pkg-unsigned-candidate-9939ea0a9fdc592e6821296e07eb0b7db3653adb --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Historical artifact download failed' }
          "ARTIFACT_ROOT=$root" >> $env:GITHUB_ENV
      - name: Live GitHub API + Sigstore/OIDC preflight (READ ONLY)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & .github/scripts/16pkg-16l1-artifact-provenance.ps1 -RunId 40710902296 -SourceSha 9939ea0a9fdc592e6821296e07eb0b7db3653adb -ArtifactRoot $env:ARTIFACT_ROOT
          if (!$?) { throw 'Real historical attestation preflight rejected' }
          Write-Host 'CLOUD VERIFICATION ONLY PASS; installer never executed; physical D: never accessed.'
      - name: Live Sigstore rejection of tampered bytes and wrong source/workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $global:PSNativeCommandUseErrorActionPreference=$false
          $repo=$env:GITHUB_REPOSITORY
          $exe=Join-Path $env:ARTIFACT_ROOT 'installer-package/CoSoSInstaller.exe'
          $tampered=Join-Path $env:RUNNER_TEMP 'tampered-unsigned-installer.exe'
          Copy-Item -LiteralPath $exe -Destination $tampered
          [IO.File]::AppendAllText($tampered,'UNTRUSTED_TAMPER')
          function MustRefuse([string[]]$VerifyArguments,[string]$Reason) {
            & gh attestation verify @VerifyArguments 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "Sigstore negative case accepted: $Reason" }
          }
          $valid=@('--repo',$repo,'--signer-workflow',"$repo/.github/workflows/16pkg-native-installer.yml")
          MustRefuse (@($tampered)+$valid) 'changed unsigned binary digest'
          MustRefuse (@($exe)+$valid+@('--source-ref','refs/heads/main')) 'wrong original source ref'
          MustRefuse (@($exe)+$valid+@('--source-digest',('f'*40))) 'wrong original source digest'
          MustRefuse (@($exe,'--repo',$repo,'--signer-workflow',"$repo/.github/workflows/ci.yml")) 'wrong signed workflow'
          # The last expected gh rejection has exit=1. It was asserted above;
          # clear the native process status so the PowerShell action is not falsely red.
          $global:LASTEXITCODE=0
          Write-Host 'LIVE SIGSTORE NEGATIVE PROOFS PASS; no installer executed.'
