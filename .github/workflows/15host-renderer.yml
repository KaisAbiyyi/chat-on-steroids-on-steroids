name: 15HOST synthetic native renderer foundation
on:
  pull_request:
    paths:
      - 'apps/windows-renderer/**'
      - 'crates/cos-app/**'
      - 'crates/cos-core/src/ui_contract.rs'
      - 'crates/cos-core/src/ui_conversation.rs'
      - 'crates/cos-core/src/ui_focus.rs'
      - 'crates/cos-core/src/ui_localization.rs'
      - 'crates/cos-core/src/ui_panels.rs'
      - 'crates/cos-core/src/ui_rich.rs'
      - 'crates/cos-core/src/ui_renderer_ipc.rs'
      - 'crates/cos-core/src/ui_snapshots.rs'
      - 'crates/cos-core/tests/ui_renderer_ipc.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/15host-renderer.yml'
  workflow_dispatch:
jobs:
  windows-contract-and-binary:
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact 15HOST PR HEAD source checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "15HOST checkout SHA mismatch: expected $env:SOURCE_SHA, actual $actual" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore WebView2 native renderer
        run: dotnet restore apps/windows-renderer/WindowsRenderer.csproj
      - name: Strict Windows native compilation
        run: dotnet build apps/windows-renderer/WindowsRenderer.csproj --configuration Release --no-restore --warnaserror
      - name: Source-compiled negative IPC fixture tests (NOT a native product test)
        run: dotnet run --project apps/windows-renderer/WindowsRenderer.csproj --configuration Release --no-build -- --contract-selftest
      - name: Hosted Windows native WebView2 candidate versus independent reference
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'apps/windows-renderer/bin/Release/net8.0-windows/WindowsRenderer.exe').Path
          $out = Split-Path $exe -Parent
          $receipt = Join-Path $out '15host-native-smoke.json'
          foreach ($mode in @('--golden-native-capture', '--synthetic-native-capture')) {
            if (Test-Path $receipt) { Remove-Item $receipt -Force }
            $proc = Start-Process -FilePath $exe -ArgumentList $mode -PassThru
            try {
              $proc | Wait-Process -Timeout 90 -ErrorAction Stop
              $proc.Refresh()
              if ($proc.ExitCode -ne 0) {
                if (Test-Path $receipt) { Get-Content $receipt -Raw | Write-Host }
                throw "Native WebView2 capture failed for $mode with exit $($proc.ExitCode)"
              }
              if (!(Test-Path $receipt)) { throw "Native WebView2 capture receipt missing for $mode" }
              $parsed = Get-Content $receipt -Raw | ConvertFrom-Json
              if (!$parsed.pass -or $parsed.syntheticOnly -ne $true -or $parsed.productAccepted -ne $false) {
                throw "Native WebView2 receipt did not satisfy synthetic-only contract for $mode"
              }
              if ($parsed.width -ne 800 -or $parsed.height -ne 600 -or $parsed.pixelSha256 -notmatch '^[0-9a-f]{64}$') {
                throw "Native WebView2 capture did not satisfy the 15F pixel descriptor for $mode"
              }
              $name = if ($mode -eq '--golden-native-capture') { '15host-reference.json' } else { '15host-candidate.json' }
              Move-Item -Path $receipt -Destination (Join-Path $out $name) -Force
            } finally {
              $proc.Refresh()
              if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          $reference = Get-Content (Join-Path $out '15host-reference.json') -Raw | ConvertFrom-Json
          $candidate = Get-Content (Join-Path $out '15host-candidate.json') -Raw | ConvertFrom-Json
          if ($reference.referenceSourceSha256 -ne $candidate.referenceSourceSha256 -or
              $reference.referenceSourceSha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Independent reference source provenance is missing or inconsistent'
          }
          # Windows WebView2 scrollbar antialiasing may vary by a single
          # channel LSB. Preserve exact source+pixel SHA-256 evidence, and
          # tolerate only <=16 one-LSB pixels in the right scrollbar thumb.
          # Any content/layout change or larger drift MUST fail this gate.
          $comparison = 'PASS_EXACT'
          $differingPixels = 0
          if ($reference.pixelSha256 -ne $candidate.pixelSha256) {
            Add-Type -AssemblyName System.Drawing
            $referenceImage = [System.Drawing.Bitmap]::FromFile((Join-Path $out '15host-reference.png'))
            $candidateImage = [System.Drawing.Bitmap]::FromFile((Join-Path $out '15host-candidate.png'))
            try {
              if ($referenceImage.Width -ne 800 -or $referenceImage.Height -ne 600 -or
                  $candidateImage.Width -ne 800 -or $candidateImage.Height -ne 600) {
                throw 'Screenshot dimensions differ from the independent 800x600 contract'
              }
              for ($y = 0; $y -lt 600; $y++) {
                for ($x = 0; $x -lt 800; $x++) {
                  $a = $referenceImage.GetPixel($x, $y)
                  $b = $candidateImage.GetPixel($x, $y)
                  if ($a.ToArgb() -eq $b.ToArgb()) { continue }
                  $differingPixels++
                  $delta = [Math]::Max([Math]::Abs([int]$a.R - [int]$b.R),
                    [Math]::Max([Math]::Abs([int]$a.G - [int]$b.G),
                      [Math]::Abs([int]$a.B - [int]$b.B)))
                  if ($differingPixels -gt 16 -or $delta -gt 1 -or
                      $a.A -ne $b.A -or $x -lt 785 -or $x -gt 790 -or
                      $y -lt 80 -or $y -gt 160) {
                    throw "Native screenshot regression outside bounded scrollbar tolerance at ($x,$y); differences=$differingPixels delta=$delta"
                  }
                }
              }
            } finally {
              $referenceImage.Dispose()
              $candidateImage.Dispose()
            }
            if ($differingPixels -eq 0) { throw 'Screenshot hashes differed but decoded pixels matched unexpectedly' }
            $comparison = 'PASS_BOUNDED_SCROLLBAR_LSB_VARIANCE'
          }
          @{ referenceSourceSha256=$reference.referenceSourceSha256; referencePixelSha256=$reference.pixelSha256;
             candidatePixelSha256=$candidate.pixelSha256; differingPixels=$differingPixels;
             width=$candidate.width; height=$candidate.height; sourceSha=$env:SOURCE_SHA;
             comparison=$comparison; approvedGolden=$false; productAccepted=$false } |
            ConvertTo-Json | Out-File -FilePath (Join-Path $out '15host-screenshot-comparison.json') -Encoding ascii
          Get-Content (Join-Path $out '15host-screenshot-comparison.json') -Raw | Write-Host
      - name: Preserve native failure evidence (no false pass)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 15host-native-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/windows-renderer/bin/Release/net8.0-windows/15host-native-smoke.json
            apps/windows-renderer/bin/Release/net8.0-windows/15host-reference.json
            apps/windows-renderer/bin/Release/net8.0-windows/15host-candidate.json
            apps/windows-renderer/bin/Release/net8.0-windows/15host-reference.png
            apps/windows-renderer/bin/Release/net8.0-windows/15host-candidate.png
          if-no-files-found: warn
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish complete source-bound .NET renderer payload
        shell: pwsh
        run: |
          dotnet publish apps/windows-renderer/WindowsRenderer.csproj -c Release --no-restore -o apps/windows-renderer/renderer-package
          if ($LASTEXITCODE -ne 0) { throw 'Renderer publish failed' }
          $root = (Resolve-Path 'apps/windows-renderer/renderer-package').Path
          $files = @(Get-ChildItem -LiteralPath $root -File -Recurse -Force | Sort-Object FullName)
          $entries = @($files | ForEach-Object {
            if (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Renderer package contains a symlink' }
            @{ path=$_.FullName.Substring($root.Length + 1).Replace('\','/'); sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $required = @('WindowsRenderer.exe','WindowsRenderer.dll','WindowsRenderer.deps.json','WindowsRenderer.runtimeconfig.json')
          foreach ($name in $required) { if ($name -notin @($entries | ForEach-Object { $_.path })) { throw "Renderer package missing $name" } }
          if ($entries.Count -gt 128) { throw 'Renderer package exceeds file count bound' }
          $json = @{ format=1; files=$entries } | ConvertTo-Json -Depth 6 -Compress
          $manifest = Join-Path $root 'renderer-integrity.json'
          [IO.File]::WriteAllText($manifest, $json, (New-Object Text.UTF8Encoding($false)))
          $manifestSha = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeSha = (Get-FileHash -LiteralPath (Join-Path $root 'WindowsRenderer.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "$env:SOURCE_SHA $exeSha $manifestSha" | Out-File -FilePath 'apps/windows-renderer/sha256-manifest.txt' -Encoding ascii
          Write-Host "Attested renderer payload: $($entries.Count) files; manifest SHA256 $manifestSha; EXE SHA256 $exeSha"
      - name: Validate renderer dependency-tampering regression
        shell: pwsh
        run: |
          cargo test -p cos-app renderer_integrity --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw '15HOST renderer integrity negative regression failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: 15host-windows-synthetic-renderer-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/windows-renderer/renderer-package/
            apps/windows-renderer/sha256-manifest.txt
          if-no-files-found: error
  ubuntu-cross-compile:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Strict Windows targeting cross-build (NOT Linux native execution)
        run: |
          dotnet restore apps/windows-renderer/WindowsRenderer.csproj
          dotnet build apps/windows-renderer/WindowsRenderer.csproj --configuration Release --no-restore --warnaserror
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust 15HOST typed contract and authenticated host regression
        run: |
          cargo fmt --all --check
          cargo test -p cos-core --test ui_renderer_ipc --locked
          cargo test -p cos-app --locked
